name: Engine
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -c requirements-ci.txt -e ".[dev]"
      - run: pytest --cov=engine --cov-fail-under=90
      - run: python scripts/validate_engine.py
      - run: python scripts/validate_skill_engine.py --baseline tests/skill-quality-baseline.json
      - run: python scripts/routing_smoke_test.py
      - run: python -m engine validate-skills
      - name: Validate SDD phase-boundary contract
        run: python scripts/validate_sdd_phase_boundaries.py --feature-dir engine/tests/fixtures/sdd_feature
      - name: Validate SRS decision and debt contract
        run: python scripts/validate_requirements_decision.py engine/tests/fixtures/requirements_decision/reuse.json
      - run: python scripts/seed_demo_project.py
      - name: Demo passes
        run: python -m engine validate projects/_demo-hybrid-regulated
      - name: Demo fails when sabotaged
        run: |
          if python -m engine validate projects/_demo-hybrid-regulated --break-something; then
            echo "Sabotaged demo unexpectedly passed" >&2
            exit 1
          fi
